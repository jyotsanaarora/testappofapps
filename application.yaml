apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: openshift-gitops
  # no resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jyotsanaarora/testdelfinalizer.git
    path: ./
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    
